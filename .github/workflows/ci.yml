name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checkpage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static page checks
        run: python tools/checkpage.py
